name: Source regressions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: games/totk/requirements.txt
      - name: Install build-tool test dependencies
        run: python -m pip install -r games/totk/requirements.txt
      - name: Run synthetic container, update and native path tests
        run: python -m unittest discover -s tests -v
      # UBSan only: on macOS 26 an AddressSanitizer build of this test hangs in dyld before main
      # (AsanInitInternal -> StaticSpinMutex::LockSlow), which would hold the job until its timeout.
      - name: Check native path parser with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_romfs_paths.c -o "$RUNNER_TEMP/test-romfs-paths"
          "$RUNNER_TEMP/test-romfs-paths"
      - name: Check the rumble and gyro settings files with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_feedback_settings.c -o "$RUNNER_TEMP/test-feedback-settings"
          "$RUNNER_TEMP/test-feedback-settings"
      - name: Check the controller layout parser with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_controller_map.c -o "$RUNNER_TEMP/test-controller-map"
          "$RUNNER_TEMP/test-controller-map"
      - name: Check the settings table and settings.txt with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_settings.c -o "$RUNNER_TEMP/test-settings"
          "$RUNNER_TEMP/test-settings"
      - name: Check the automatic frame rate limit with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_autocap.c -o "$RUNNER_TEMP/test-autocap"
          "$RUNNER_TEMP/test-autocap"
      - name: Check the mods folder and the ResourceSizeTable patch with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_mods.c games/totk/third_party/zstd/zstddeclib.c -o "$RUNNER_TEMP/test-mods"
          TMPDIR="$RUNNER_TEMP" "$RUNNER_TEMP/test-mods"
      - name: Check where cheat files come from (the cheats folder, mods) with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_cheat_files.c -o "$RUNNER_TEMP/test-cheat-files"
          TMPDIR="$RUNNER_TEMP" "$RUNNER_TEMP/test-cheat-files"
      - name: Check the community cheat list reader and the Cheats tab catalog with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_cheat_catalog.c -o "$RUNNER_TEMP/test-cheat-catalog"
          "$RUNNER_TEMP/test-cheat-catalog"
      - name: Check the actor spawner queue and name check with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_actor_spawn.c -o "$RUNNER_TEMP/test-actor-spawn"
          "$RUNNER_TEMP/test-actor-spawn"
      - name: Check the Spawn tab's list, search, favorites and recents with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_spawn_list.c -o "$RUNNER_TEMP/test-spawn-list"
          "$RUNNER_TEMP/test-spawn-list"
      - name: Check the keyboard and mouse layout parser with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_keyboard_map.c -o "$RUNNER_TEMP/test-keyboard-map"
          "$RUNNER_TEMP/test-keyboard-map"
      - name: Check the game language mapping with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_game_language.c -o "$RUNNER_TEMP/test-game-language"
          "$RUNNER_TEMP/test-game-language"
      - name: Check the Breath of the Wild audio ramp arithmetic with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_audio_ramp.c -o "$RUNNER_TEMP/test-audio-ramp"
          "$RUNNER_TEMP/test-audio-ramp"
      - name: Check the bow state reader (DualSense triggers) with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_bow_state.c -o "$RUNNER_TEMP/test-bow-state"
          "$RUNNER_TEMP/test-bow-state"
